name: ci-probe
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe release write
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.0.2-probe 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.0.2-probe --title "probe2" --notes "probe2" --draft
            if ($LASTEXITCODE -eq 0) { echo "::notice title=relwrite::RELEASE_CREATE_OK" } else { echo "::error title=relwrite::RELEASE_CREATE_FAILED" }
          } else { echo "::notice title=relwrite::RELEASE_EXISTS" }
          "content-123" | Out-File -Encoding utf8 asset.txt
          gh release upload v0.0.2-probe asset.txt --clobber
          if ($LASTEXITCODE -eq 0) { echo "::notice title=relasset::ASSET_UPLOAD_OK" } else { echo "::error title=relasset::ASSET_UPLOAD_FAILED" }
      - name: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash asset.txt -Algorithm SHA256).Hash.ToLower()
          echo "::notice title=sha::SHA256=$h"
          echo "hash was $h"
