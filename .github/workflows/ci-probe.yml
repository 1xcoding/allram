name: ci-probe
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: make file
        shell: pwsh
        run: |
          "hello-artifact" | Out-File -Encoding utf8 hello.txt
          Get-ComputerInfo -Property OsName,OsVersion | Out-String | Out-File info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-artifact
          path: |
            hello.txt
            info.txt
